apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-daemon
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: trading-daemon
      values: |
        name: trading-daemon
        command: ["python", "-u", "daemon.py"]
        workdir: "/work/src"
        hostNetwork: true
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
