apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-daemon
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: trading-daemon
      values: |
        name: trading-daemon
        command: ["python", "-u", "daemon.py"]
        workdir: "/work/src"
        hostNetwork: true
        nodeName: nexus
        env:
          - name: TRADING_METRICS_BIND
            value: "0.0.0.0:9797"
        # Declarative roll knob: bump to roll the daemon (it imports code at startup,
        # so a new pod is required to pick up repo changes).
        restartedAt: "2026-09-22T17:49:06Z"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
