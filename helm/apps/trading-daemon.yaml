apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-daemon
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: trading-daemon
      values: |
        name: trading-daemon
        # Sources the host exec.env at RUNTIME (no secret in git, the same
        # pattern trading-reconcile* already use). The k3s cutover dropped the
        # host unit's EnvironmentFile=…/data/exec.env, which took ALCHEMY_KEY
        # and EXEC_RPC_URL with it: the daemon's EVM dryrun failed 3x with
        # "ALCHEMY_KEY not set (and no EVMC_RPC_URL override)" at
        # 2026-09-22T13:58:42-44Z, the startup log shows the keyless public
        # `rpc=https://api.devnet.solana.com` instead of the keyed endpoint, and
        # the live canary lane lost EXEC_RPC_URL_MAINNET (src/canary_exec.py).
        #
        # THE `unset` IS STILL MANDATORY for the SOL path. exec.env carries
        # EXEC_ARMED=1, EVMC_ALLOW_LIVE=1 and FUEL_REFUEL_MODE=armed;
        # config/exec.yaml already says `armed: true`, so the SOL two-key
        # (EXEC_ARMED truthy) AND (cfg.armed) is one variable away, and
        # FUEL_REFUEL_MODE=armed flips the refueler's default off to armed.
        # Both stay stripped. The breaker stays halted and nothing is resumed.
        #
        # THE RHC ARM (owner decision 2026-09-23, CAPITAL-LADDER.md Q7+Q8).
        # EVMC_ALLOW_LIVE=1 is the FIRST key of the RHC live lane's two-key
        # (src/evm_executor.py::resolve_mode -- it needs this AND a caller
        # passing mode="live", which src/evm_canary.py::_execute_buy does
        # deliberately, against config/evm_canary.yaml `enabled: true`).
        # Without it the daemon's RHC mirror logs `[EVMCANARY] RHC mirror
        # ACTIVE` and every real buy dies at resolve_mode -> recorded
        # `blocked`, never sent: the ACTIVE-but-cannot-send defect Q8 fixed.
        # It is re-exported EXPLICITLY (not left to `set -a; . exec.env`)
        # so the one place that arms this lane is greppable in git, and
        # scripts/check_apps.py enforces exactly that. Size is unchanged:
        # trade_usd 0.8, max_per_trade_eth 0.0015, max_sends_per_hour 6.
        command: ["sh", "-c", "set -a; . /work/data/exec.env 2>/dev/null; set +a; unset EXEC_ARMED FUEL_REFUEL_MODE; export EVMC_ALLOW_LIVE=1; exec python -u /work/src/daemon.py"]
        workdir: "/work/src"
        hostNetwork: true
        nodeName: nexus
        env:
          - name: TRADING_METRICS_BIND
            value: "0.0.0.0:9797"
        # Declarative roll knob: bump to roll the daemon (it imports code at startup,
        # so a new pod is required to pick up repo changes).
        restartedAt: "2026-09-23T08:26:12Z"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
