apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-daemon
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: trading-daemon
      values: |
        name: trading-daemon
        # Sources the host exec.env at RUNTIME (no secret in git, the same
        # pattern trading-reconcile* already use). The k3s cutover dropped the
        # host unit's EnvironmentFile=…/data/exec.env, which took ALCHEMY_KEY
        # and EXEC_RPC_URL with it: the daemon's EVM dryrun failed 3x with
        # "ALCHEMY_KEY not set (and no EVMC_RPC_URL override)" at
        # 2026-09-22T13:58:42-44Z, the startup log shows the keyless public
        # `rpc=https://api.devnet.solana.com` instead of the keyed endpoint, and
        # the live canary lane lost EXEC_RPC_URL_MAINNET (src/canary_exec.py).
        #
        # THE `unset` IS STILL MANDATORY for the SOL path. exec.env carries
        # EXEC_ARMED=1, EVMC_ALLOW_LIVE=1 and FUEL_REFUEL_MODE=armed;
        # config/exec.yaml already says `armed: true`, so the SOL two-key
        # (EXEC_ARMED truthy) AND (cfg.armed) is one variable away, and
        # FUEL_REFUEL_MODE=armed flips the refueler's default off to armed.
        # Both stay stripped. The breaker stays halted and nothing is resumed.
        #
        # THE RHC ARM (owner decision 2026-09-23, CAPITAL-LADDER.md Q7+Q8).
        # EVMC_ALLOW_LIVE=1 is the FIRST key of the RHC live lane's two-key
        # (src/evm_executor.py::resolve_mode -- it needs this AND a caller
        # passing mode="live", which src/evm_canary.py::_execute_buy does
        # deliberately, against config/evm_canary.yaml `enabled: true`).
        # Without it the daemon's RHC mirror logs `[EVMCANARY] RHC mirror
        # ACTIVE` and every real buy dies at resolve_mode -> recorded
        # `blocked`, never sent: the ACTIVE-but-cannot-send defect Q8 fixed.
        # It is re-exported EXPLICITLY (not left to `set -a; . exec.env`)
        # so the one place that arms this lane is greppable in git, and
        # scripts/check_apps.py enforces exactly that. Size is unchanged:
        # trade_usd 0.8, max_per_trade_eth 0.0015, max_sends_per_hour 6.
        # DISARMED 2026-10-14 (owner decision: no live until an edge is proven):
        # EVMC_ALLOW_LIVE is now UNSET like the other two keys. To re-arm the RHC
        # live lane, restore `export EVMC_ALLOW_LIVE=1` here (two-key: also exec.env).
        command: ["sh", "-c", "set -a; . /work/data/exec.env 2>/dev/null; set +a; unset EXEC_ARMED EVMC_ALLOW_LIVE FUEL_REFUEL_MODE; exec python -u /work/src/daemon.py"]
        workdir: "/work/src"
        hostNetwork: true
        nodeName: nexus
        env:
          - name: TRADING_METRICS_BIND
            value: "0.0.0.0:9797"
        # Declarative roll knob: bump to roll the daemon (it imports code at startup,
        # so a new pod is required to pick up repo changes).
        #
        # 2026-10-23T05:10:00Z — roll onto master 16623d5 (the steward deploy):
        #   * #17 (5c3bd08): `src/rpc_budget.py` monthly pacing ledger, the
        #     per-wallet `logsSubscribe` feed (`src/wallet_stream.py`), the lane
        #     selector (`src/solana_lanes.py`), and the Enhanced-API call deleted.
        #   * #16 (16623d5): Jupiter v2 client + the POST /swap `x-api-key` fix.
        #
        # NO image change and NO new env, both measured rather than assumed:
        #   * the container runs `/work/src/daemon.py` off the hostPath mount of
        #     ~/Work/trading, so this roll is the code deploy; the image only has
        #     to supply the interpreter. Verified in the running pod 2026-10-23:
        #     python 3.11.17 with websockets 17.2 (`wallet_stream` needs >=14,
        #     already installed by deploy/Dockerfile.jobs). Neither merged PR adds
        #     a dependency, so a kaniko rebuild would download ~3.7 GiB of torch
        #     to change a revision label.
        #   * the free-provider lanes need no Secret: `solana_lanes._free_env()`
        #     and `rpc_budget._free_env()` read `$FREE_PROVIDERS_ENV`, then
        #     `<repo>/.env.free-providers`, then ~/Work/trading/.env.free-providers.
        #     The first repo path is the same hostPath mount, so the file is
        #     already inside the pod. Verified from the running pod: uid 1000
        #     reads /work/.env.free-providers (0600, same uid) and writes
        #     /work/data/ (the pacing ledger is data/rpc_budget.sqlite).
        #     This repo has no SealedSecret/SOPS mechanism to move it into
        #     (grep: none; the cluster's ExternalSecret pattern is not used in
        #     this repo and the trading namespace holds zero Secrets).
        restartedAt: "2026-10-23T05:10:00Z"
        trigger:
          kind: "service"
          justification: "the paper daemon's own load-dependent ~25-110 s cycle; a service, never a timer"
          liveness-verifier: "trading-watchdog (daemon heartbeat age)"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
