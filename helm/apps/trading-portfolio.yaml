apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-portfolio
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-portfolio
      values: |
        name: trading-portfolio
        schedule: "11-59/15 * * * *"   # GMGN stagger: share the 15-min slot one job at a time
        command: ["python", "tools/portfolio_watch.py"]
        backoffLimit: 0   # never re-run a whole sweep: a retry is more requests
        deadline: 240
        nodeName: nexus
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "derived"
          justification: "the equity trace is derived state: recompute when the book moves, with a 30-min floor so the sample the guards read is never stale"
          invalidated-by: "data/signals.sqlite fills (our book) and data/evm_moonbags.json"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 1800
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
