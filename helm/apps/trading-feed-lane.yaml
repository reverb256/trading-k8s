apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-feed-lane
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-feed-lane
      values: |
        name: trading-feed-lane
        schedule: "*/5 * * * *"
        command: ["python", "tools/feed_lane.py", "--seconds", "45"]
        # Requests-sized per workload (t_6cf16590): own 7d/5m p95 19.8m over 389
        # incarnations (70 of them >10m), cpu -> next 10m.
        cpuRequest: 20m
        deadline: 180
        hostNetwork: true
        trigger:
          kind: "event"
          justification: "short listener window on the RHC feed relay, appending to data/feed_lane.jsonl; the schedule re-arms the window (a long-lived subscription is filed as remaining work)"
          event-source: "feed_lane.jsonl"
          rearm: "listener"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
