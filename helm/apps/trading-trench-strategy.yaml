apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-trench-strategy
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-trench-strategy
      values: |
        name: trading-trench-strategy
        schedule: "5-59/10 * * * *"   # GMGN stagger: share the 10-min slot one job at a time
        command: ["python", "tools/trench_strategy.py"]
        backoffLimit: 0   # never re-run a whole sweep: a retry is more requests
        deadline: 300
        repoMount: true
        configMount: true
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "external-poll"
          justification: "trench strategy reads the GMGN trenches snapshot through the governed caller"
          governor: "gmgn_common"
          change-detection: "cache"
          staleness-floor: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
