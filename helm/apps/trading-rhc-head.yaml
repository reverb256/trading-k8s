apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-rhc-head
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: trading-rhc-head
      values: |
        name: trading-rhc-head
        command: ["python", "-u", "tools/rhc_head.py"]
        workdir: "/work"
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "service"
          justification: "RHC head sensing instrument (0.2 s keep-alive poll) - the cheap head the whole lane reads"
          liveness-verifier: "gates_run G13 (rhc head watcher active and fresh)"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
