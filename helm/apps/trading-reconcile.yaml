apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-reconcile
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-reconcile
      values: |
        name: trading-reconcile
        # Every 30 min (was daily 04:45). The release gate
        # (src/breakers.py::damage_release_vetoes) only counts rows with
        # ts >= halt_ts, so a daily cadence made "no drift since the halt"
        # vacuous for every halt between one run and the next. Cost is one
        # getSignaturesForAddress call per run (reconcile.py pages only when a
        # wallet exceeds --limit), so 48 runs/day stays inside RPC budgets.
        schedule: "15,45 * * * *"
        # Sources exec.env at runtime for the RPC failover: without it
        # EXEC_RPC_URL_FALLBACK is unset in the pod, so a 429 on the primary
        # devnet endpoint fails the job outright and leaves NO row — the gate
        # then reads a stale ledger as clean. The env's fallback is Alchemy
        # devnet, i.e. the CORRECT chain for this devnet wallet.
        command: ["sh", "-c", "set -a; . /work/data/exec.env 2>/dev/null; set +a; unset EXEC_ARMED EVMC_ALLOW_LIVE FUEL_REFUEL_MODE; exec python tools/reconcile.py --wallet 5qUpL8vDkBANtoaFfSvCRysa8MkndJNLu1dKsHfxUPZv --log data/exec_log.jsonl"]
        deadline: 600
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "absence"
          justification: "asserts wallet-vs-log agreement and re-reads only unresolved rows; never sends"
          verifies: "Solana wallet-vs-exec_log agreement and the age of the newest reconciled row"
          mutates: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
