apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-reconcile
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-reconcile
      values: |
        name: trading-reconcile
        schedule: "45 4 * * *"
        command: ["python", "tools/reconcile.py", "--wallet", "5qUpL8vDkBANtoaFfSvCRysa8MkndJNLu1dKsHfxUPZv", "--log", "data/exec_log.jsonl"]
        deadline: 600
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
