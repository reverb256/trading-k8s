apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-reconcile
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-reconcile
      values: |
        name: trading-reconcile
        # Every 30 min (was daily 04:45). The release gate
        # (src/daemon.py::_halt_contaminated) only flags drift from a row with
        # ts >= halt_ts, so a daily cadence made "no drift since the halt"
        # vacuous for every halt between one run and the next. Cost is one
        # getSignaturesForAddress call per run (reconcile.py pages only when a
        # wallet exceeds --limit), so 48 runs/day stays inside RPC budgets.
        schedule: "15,45 * * * *"
        command: ["python", "tools/reconcile.py", "--wallet", "5qUpL8vDkBANtoaFfSvCRysa8MkndJNLu1dKsHfxUPZv", "--log", "data/exec_log.jsonl"]
        deadline: 600
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
