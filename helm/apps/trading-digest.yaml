apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-digest
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-digest
      values: |
        name: trading-digest
        schedule: "5 8 * * *"
        command: ["python", "tools/promotion_digest.py"]
        deadline: 300
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "calendar"
          justification: "the daily digest is a calendar artifact: 'a day passed' is the trigger"
          mutates: "reports"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
