apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-rhc-ml
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-rhc-ml
      values: |
        name: trading-rhc-ml
        schedule: "15 */6 * * *"
        command: ["sh", "-c", "python", "tools/rhc_dataset.py && python tools/rhc_ml.py"]
        deadline: 300
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
