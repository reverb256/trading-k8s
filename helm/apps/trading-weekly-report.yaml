apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-weekly-report
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-weekly-report
      values: |
        name: trading-weekly-report
        schedule: "0 18 * * 0"
        command: ["python", "-u", "tools/weekly_loss_report.py", "--notify"]
        deadline: 600
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "calendar"
          justification: "the weekly loss report is a calendar artifact"
          mutates: "reports"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
