apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-gradplay
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-gradplay
      values: |
        name: trading-gradplay
        schedule: "*/10 * * * *"
        command: ["python", "tools/gradplay_strategy.py"]
        gpu: false
        deadline: 300
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "entry feed is data/graduations.jsonl: no new graduation means nothing to enter; the 30-min floor still marks open positions"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 1800
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
