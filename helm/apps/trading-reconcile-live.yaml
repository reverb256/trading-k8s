apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-reconcile-live
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-reconcile-live
      values: |
        name: trading-reconcile-live
        # Every 30 min (was daily 05:05): the release gate
        # (src/breakers.py::damage_release_vetoes) only sees drift in a row with
        # ts >= halt_ts, so a daily cadence made the check vacuous.
        schedule: "0,30 * * * *"
        # Sources the host exec.env at RUNTIME (no secret in git, same pattern as
        # trading-reconcile-evm) for two reasons:
        #  1. --rpc "${EXEC_RPC_URL_MAINNET:-...}" (Helius) restores what the
        #     pre-migration host timer ran. The k8s cutover dropped the flag and
        #     silently fell back to the keyless public mainnet endpoint.
        #     NB the variable MUST be double-quoted, not single-quoted: single
        #     quotes suppress expansion and python receives the literal text
        #     (observed 2026-09-22T18:30Z: "unknown url type:
        #     '$EXEC_RPC_URL_MAINNET'"). The :? default keeps it working if the
        #     env is ever absent.
        #  2. EXEC_RPC_URL_FALLBACK is OVERRIDDEN to a MAINNET endpoint. The
        #     global fallback in exec.env is solana-devnet.g.alchemy.com — so a
        #     mainnet failover queried the WRONG CHAIN. A devnet endpoint cannot
        #     see mainnet signatures: if it answers instead of erroring, every
        #     logged send reads "unconfirmed" -> a FALSE drift:true, which is
        #     exactly what contaminates the release gate.
        command: ["sh", "-c", "set -a; . /work/data/exec.env 2>/dev/null; set +a; unset EXEC_ARMED EVMC_ALLOW_LIVE FUEL_REFUEL_MODE; export EXEC_RPC_URL_FALLBACK='https://api.mainnet-beta.solana.com'; exec python tools/reconcile.py --wallet Ghr7xwP6HqzYVeXAq7uToR7poUSQuJ9pB8dCeQqA5wmf --log data/exec_log.jsonl --rpc \"${EXEC_RPC_URL_MAINNET:-https://api.mainnet-beta.solana.com}\""]
        deadline: 600
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "absence"
          justification: "live-wallet twin of trading-reconcile; asserts agreement, never sends"
          verifies: "live wallet-vs-exec_log agreement"
          mutates: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
