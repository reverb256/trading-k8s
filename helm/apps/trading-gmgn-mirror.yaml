apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-gmgn-mirror
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-gmgn-mirror
      values: |
        name: trading-gmgn-mirror
        schedule: "2-59/5 * * * *"   # GMGN stagger: offset off the :00/:05 cluster burst
        command: ["python", "tools/gmgn_mirror.py"]
        backoffLimit: 0   # never re-run a whole sweep: a retry is more requests
        deadline: 240
        repoMount: true
        configMount: true
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "external-poll"
          justification: "GMGN mirror reads through the governed RPC/GMGN callers; cached, coalesced, paced"
          governor: "rpc_common"
          change-detection: "cache"
          staleness-floor: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
