apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-grad-sweep
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-grad-sweep
      values: |
        name: trading-grad-sweep
        schedule: "0 4 * * *"
        command: ["python", "tools/grad_sweep.py"]
        gpu: true
        deadline: 1200
        trigger:
          kind: "calendar"
          justification: "daily parameter sweep over accumulated data"
          mutates: "study-only"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
