# ArgoCD Application: trading-rhc-price
# RHC curve-price sampler (migrated from systemd timer 2026-09-21, pilot of the k3s migration).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-rhc-price
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/rhc-price
    helm:
      releaseName: rhc-price
      values: |
        # Requests-sized from this workload's OWN p95 (t_5edaea07), never from a
        # namespace-wide number: 7d window at 5m resolution, max over every pod
        # incarnation, cpu -> next 10m, memory -> next 16Mi.
        #   cpu    868.27m  worst incarnation trading-rhc-price-29834905-p9pb9
        #                  (its cumulative counter goes 0.07 -> 26.12 cpu-seconds
        #                  inside one ~30 s run, i.e. ~0.87 cores sustained)
        #   memory 163.51Mi worst incarnation trading-rhc-price-29834895-2psmw
        # -> 870m / 176Mi.  Requests only: the chart declares no limits at all, so
        # `request <= limit` is not binding here and limits are the separate pass
        # (t_56f17002).  The chart's 10m/64Mi defaults render exactly the
        # `default-requests` LimitRange floor this container used to inherit.
        cpuRequest: 870m
        memRequest: 176Mi
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "samples bonding-curve reserves for the mints we already hold - the cheap head is the RHC block head"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
