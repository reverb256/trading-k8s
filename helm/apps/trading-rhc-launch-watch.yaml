apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-rhc-launch-watch
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-rhc-launch-watch
      values: |
        name: trading-rhc-launch-watch
        schedule: "4-59/5 * * * *"
        command: ["python", "tools/rhc_launch_watch.py", "--seconds", "52"]
        # Requests-sized per workload (t_6cf16590): own 7d/5m p95 16.1m over 1109
        # incarnations (113 of them >10m), cpu -> next 10m. Memory p95 59.3Mi is
        # already under the 64Mi request.
        cpuRequest: 20m
        deadline: 120
        hostNetwork: true
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "launches appear as blocks advance; the head is the only trigger that matters, and a 15-min floor keeps the book sampled if the chain stalls"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 900
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
