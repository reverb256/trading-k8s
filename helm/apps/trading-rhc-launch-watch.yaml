apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-rhc-launch-watch
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-rhc-launch-watch
      values: |
        name: trading-rhc-launch-watch
        schedule: "* * * * *"
        command: ["python", "tools/rhc_launch_watch.py", "--seconds", "52"]
        deadline: 120
        hostNetwork: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
