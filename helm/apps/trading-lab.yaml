apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-lab
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-lab
      values: |
        name: trading-lab
        schedule: "3-59/15 * * * *"   # GMGN stagger: 45-call sweep must not share a minute
        command: ["python", "tools/strategy_lab.py", "collect"]
        # Requests-sized per workload (t_6cf16590). Own 7d/5m p95 366.2m over its
        # 8 incarnations (366.2/347.8/327.9/320.6/319.5/295.0/126.2/98.9m), max
        # over pods, cpu -> next 10m. NOT a namespace-wide number: the ns-wide max
        # over `job` equals it only because all 6 top pods in the ns are
        # trading-lab incarnations (5 `trading-lab-*` runs + the manual
        # `--from=cronjob/trading-lab` pod lab-verify-1790098831-g5fb5).
        cpuRequest: 370m
        backoffLimit: 0   # never re-run a whole sweep: a retry is more requests
        deadline: 300
        repoMount: true
        configMount: true
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
