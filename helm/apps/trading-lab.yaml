apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-lab
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-lab
      values: |
        name: trading-lab
        schedule: "*/15 * * * *"
        command: ["python", "tools/strategy_lab.py", "collect"]
        deadline: 300
        repoMount: true
        configMount: true
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
