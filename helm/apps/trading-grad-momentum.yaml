apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-grad-momentum
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-grad-momentum
      values: |
        name: trading-grad-momentum
        schedule: "*/5 * * * *"
        command: ["python", "tools/grad_momentum.py"]
        gpu: false
        deadline: 180
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "samples fresh graduations only; the graduation feed is the head"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
