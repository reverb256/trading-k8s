apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-mcp
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: trading-mcp
      values: |
        name: trading-mcp
        command: ["python", "/work/mcp/trading_mcp_server.py"]
        workdir: "/work"
        initCommand: ["pip", "install", "--quiet", "mcp<2"]
        hostNetwork: true
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
