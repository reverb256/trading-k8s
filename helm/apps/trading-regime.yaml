apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-regime
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-regime
      values: |
        name: trading-regime
        schedule: "7 * * * *"
        command: ["python", "tools/regime.py"]
        deadline: 240
        nodeName: nexus
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "derived"
          justification: "regime is derived from the memecoin heat feed + 24 h price change; the hourly floor keeps the entry gate's input fresh"
          invalidated-by: "data/pumpfun_stats.jsonl (heat feed)"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 3600
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
