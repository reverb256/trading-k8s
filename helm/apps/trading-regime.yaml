apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-regime
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-regime
      values: |
        name: trading-regime
        schedule: "7 * * * *"
        command: ["python", "tools/regime.py"]
        deadline: 240
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
