apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-alerts
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-alerts
      values: |
        name: trading-alerts
        schedule: "*/2 * * * *"
        command: ["python", "tools/halt_alerts.py", "--once"]
        # Requests-sized per workload (t_6cf16590): own 7d/5m p95 29.6m over 61
        # incarnations (11 of them >10m), cpu -> next 10m.
        cpuRequest: 30m
        deadline: 600
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
