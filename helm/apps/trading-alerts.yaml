apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-alerts
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-alerts
      values: |
        name: trading-alerts
        schedule: "*/2 * * * *"
        command: ["python", "tools/halt_alerts.py", "--once"]
        # Requests-sized per workload (t_6cf16590): own 7d/5m p95 29.6m over 61
        # incarnations (11 of them >10m), cpu -> next 10m.
        cpuRequest: 30m
        deadline: 600
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        # The halt-alert peer credential is an ENV-ONLY 0600 file, never a value
        # in git: this names the path the pod reads it from. The repo is
        # hostPath-mounted at /work, so /work/data/halt_peer.env IS the host's
        # data/halt_peer.env. Rendered by the trading repo's
        # deploy/halt-alerts/provision-peer-env.py; git-ignored; and
        # tools/halt_alerts.py refuses any peer file that is not 0600.
        env:
          - name: HALT_ALERTS_PEER_FILE
            value: "/work/data/halt_peer.env"
        trigger:
          kind: "event"
          justification: "drains the halt-alert source (cursor-driven) and delivers it A2A; the schedule only RE-ARMS a time-critical drain window (60 s bound for a halt)"
          event-source: "alert_cursor.json"
          rearm: "listener"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
      # REPLACE (2026-09-22): this CronJob carried a hand-`kubectl patch`ed
      # volumeMount + volume for the whole host `/home/j_kro/.hermes` directory
      # (added 2026-09-22T02:35Z by field manager `kubectl-patch`) that git does
      # not declare — an out-of-git mount handing the job the agent's ENTIRE
      # config, provider keys included, to work around the peer-config gap. The
      # entry belongs to another field manager, so a normal server-side-apply
      # sync leaves it in place; only a full replace drops what the manifest does
      # not declare. With it gone the job authenticates from the 0600 peer file
      # above and reads nothing from ~/.hermes.
      - Replace=true
