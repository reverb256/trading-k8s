apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-shadow
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: trading-shadow
      values: |
        name: trading-shadow
        command: ["python", "-u", "tools/meta_shadow.py", "--loop", "60"]
        workdir: "/work"
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
