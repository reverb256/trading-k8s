apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-alloc
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-alloc
      values: |
        name: trading-alloc
        schedule: "*/30 * * * *"
        command: ["python", "-u", "tools/allocator.py"]
        deadline: 900
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
