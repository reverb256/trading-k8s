apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-alloc
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-alloc
      values: |
        name: trading-alloc
        schedule: "*/30 * * * *"
        command: ["python", "-u", "tools/allocator.py"]
        deadline: 900
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "derived"
          justification: "sleeve multipliers are a function of closed trades; recompute when the fill ledger moves"
          invalidated-by: "data/signals.sqlite fills (closed-trade returns)"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
