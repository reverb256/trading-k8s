apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-cluster-summary
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-cluster-summary
      values: |
        name: trading-cluster-summary
        schedule: "15 * * * *"
        command: ["python", "tools/cluster_summary.py"]
        gpu: false
        deadline: 180
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "derived"
          justification: "summary is a pure function of resolved shadow outcomes; recompute when the shadow file changes, 2 h floor for freshness of the report"
          invalidated-by: "data/cluster_shadow.jsonl (resolved outcomes)"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 7200
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
