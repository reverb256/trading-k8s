apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-jup-perps-exec
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-jup-perps-exec
      values: |
        name: trading-jup-perps-exec
        schedule: "*/15 * * * *"
        command: ["python", "tools/jup_perps_exec.py", "--dry-run"]
        deadline: 240
        repoMount: true
        configMount: true
        # JUP-KEY-REACHABILITY (2026-09-26): tools/jup_perps_exec.py shells out to
        # the jup CLI, whose activeKey (~/.config/jup/keys/float.json) is a symlink
        # into this repo. Without the repo mounted at its host path the CLI fails
        # with `Key "float" does not exist.` and the preview dies (job Error).
        repoHomeMount: true
        hostNetwork: false
        nodeName: nexus
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "dry-run perps executor: the price series is its head (live is still refused in code)"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 3600
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
