apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-watchdog
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-watchdog
      values: |
        name: trading-watchdog
        schedule: "*/5 * * * *"
        command: ["python", "tools/watchdog.py", "--once"]
        deadline: 240
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
