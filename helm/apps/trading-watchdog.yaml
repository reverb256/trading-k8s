apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-watchdog
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-watchdog
      values: |
        name: trading-watchdog
        # 5 min, matching the pre-migration host timer's cadence. The release
        # gate reads "no non-ok row since the halt" as health, so the witness
        # must beat at least as often as the gate's 45-min cooldown + 30-min
        # stabilize window; 5 min also makes a missed tick obvious.
        schedule: "*/5 * * * *"
        command: ["python", "tools/watchdog_k8s.py", "--once"]
        # 120 -> 180 (2026-09-26): pod start measured at 60-94s while the
        # host is I/O-saturated, so a 120s deadline can be eaten by the start
        # alone and the SIGKILLed run leaves no log.
        deadline: 180
        repoMount: true
        configMount: false
        # hostNetwork so the loopback status probe reaches the MCP deployment
        # (trading-mcp is itself hostNetwork and serves :8794 on the node).
        hostNetwork: true
        nodeName: nexus
        trigger:
          kind: "absence"
          justification: "the one slow verifier: asserts daemon heartbeat age, MCP reachability and the fill-driven mirror's witness age; never re-does any work"
          verifies: "daemon heartbeat age (300 s), MCP status, mirror witness age and last mirror fault"
          mutates: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
