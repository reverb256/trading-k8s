apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-pumpfun-watch
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: trading-pumpfun-watch
      values: |
        name: trading-pumpfun-watch
        command: ["python", "tools/pumpfun_watch.py"]
        workdir: "/work"
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "service"
          justification: "firehose listener writing data/pumpfun_watch.jsonl"
          liveness-verifier: "trading-graduation-tracker (its feed head) + gate G17"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
