apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-rhc-grad-watch
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-rhc-grad-watch
      values: |
        name: trading-rhc-grad-watch
        schedule: "* * * * *"
        command: ["python", "tools/rhc_grad_watch.py", "--tail", "50"]
        deadline: 55
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
