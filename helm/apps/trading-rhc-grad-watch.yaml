apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-rhc-grad-watch
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-rhc-grad-watch
      values: |
        name: trading-rhc-grad-watch
        schedule: "3-59/5 * * * *"
        command: ["python", "tools/rhc_grad_watch.py", "--tail", "45"]
        # Requests-sized per workload (t_6cf16590): own 7d/5m p95 15.8m over 852
        # incarnations (151 of them >10m), cpu -> next 10m. Memory p95 50.4Mi is
        # already under the 64Mi request.
        cpuRequest: 20m
        # 75 -> 120 (2026-09-26). activeDeadlineSeconds counts from JOB creation,
        # so it is already 9-22s old (measured here) by the time the container
        # starts, while the command bounds its own work at --tail 45 and the
        # tool's own cap is 45+30=75s (tools/rhc_grad_watch.py: the outer
        # wait_for(consume(seconds), timeout=seconds + 30) that prints
        # RHC-GRAD-FAIL). Deadline 75 was therefore EQUAL to that cap: when the
        # pod started late, Kubernetes SIGKILLed
        # trading-rhc-grad-watch-29840438 mid-run (DeadlineExceeded, 2026-09-26)
        # before the tool could print its own failure line, and the run left no
        # log to diagnose. 120 leaves the tool its 30s of self-timeout slack plus
        # the pod-start latency, and matches rhc-launch-watch (--seconds 52 /
        # deadline 120). Normal runs finish in ~52s; the guard is
        # scripts/check_apps.py rule 6.
        deadline: 120
        hostNetwork: true
        nodeName: nexus
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "graduations are read off the RHC head; unchanged head means nothing to read"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
