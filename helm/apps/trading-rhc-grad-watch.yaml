apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-rhc-grad-watch
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-rhc-grad-watch
      values: |
        name: trading-rhc-grad-watch
        schedule: "* * * * *"
        command: ["python", "tools/rhc_grad_watch.py", "--tail", "45"]
        # Requests-sized per workload (t_6cf16590): own 7d/5m p95 15.8m over 852
        # incarnations (151 of them >10m), cpu -> next 10m. Memory p95 50.4Mi is
        # already under the 64Mi request.
        cpuRequest: 20m
        deadline: 75
        hostNetwork: true
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
