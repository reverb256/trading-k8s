apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-moonbag
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-moonbag
      values: |
        name: trading-moonbag
        schedule: "45 17 * * *"
        command: ["python", "tools/moonbag_monitor.py"]
        deadline: 300
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "external-poll"
          justification: "moonbag marks read the GMGN/RHC data already cached by the governed callers"
          governor: "gmgn_common"
          change-detection: "cache"
          staleness-floor: "none"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
