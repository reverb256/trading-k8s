apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-recal
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-recal
      values: |
        name: trading-recal
        schedule: "20 5 * * 0"
        command: ["python", "-u", "tools/recal_report.py"]
        deadline: 300
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "calendar"
          justification: "weekly breaker recalibration over accumulated outcomes"
          mutates: "study-only"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
