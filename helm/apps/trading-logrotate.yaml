apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-logrotate
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-logrotate
      values: |
        name: trading-logrotate
        schedule: "3 2 * * *"
        command: ["bash", "scripts/rotate_daemon_log.sh"]
        deadline: 300
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
        trigger:
          kind: "calendar"
          justification: "daily log maintenance - not trading state"
          mutates: "ops"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
