apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-grad-study
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-grad-study
      values: |
        name: trading-grad-study
        schedule: "0 */6 * * *"
        command: ["python", "tools/graduation_study.py"]
        gpu: false
        deadline: 300
        trigger:
          kind: "calendar"
          justification: "batch study over accumulated graduations (6 h window)"
          mutates: "study-only"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
