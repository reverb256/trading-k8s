apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-jup-paper
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-jup-paper
      values: |
        name: trading-jup-paper
        schedule: "*/15 * * * *"
        command: ["python", "tools/jup_perps.py", "--paper-run"]
        deadline: 240
        nodeName: nexus
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "paper perps marks move with the price series; no new sample means nothing to mark"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 3600
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
