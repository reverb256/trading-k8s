apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-jup-paper
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-jup-paper
      values: |
        name: trading-jup-paper
        schedule: "*/15 * * * *"
        command: ["python", "tools/jup_perps.py --paper-run"]
        deadline: 240
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
