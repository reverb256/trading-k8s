apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alert-receiver
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-svc
    helm:
      releaseName: alert-receiver
      values: |
        name: alert-receiver
        command: ["python", "tools/alert_receiver.py", "9799"]
        workdir: "/work"
        hostNetwork: true
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
