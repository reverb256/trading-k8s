apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-attention
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-attention
      values: |
        name: trading-attention
        schedule: "*/10 * * * *"
        command: ["python", "tools/attention_watch.py"]
        gpu: false
        deadline: 180
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
