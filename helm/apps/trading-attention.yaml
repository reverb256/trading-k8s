apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-attention
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-attention
      values: |
        name: trading-attention
        schedule: "*/10 * * * *"
        command: ["python", "tools/attention_watch.py"]
        gpu: false
        deadline: 180
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "the crawl is the probe (two free GETs, no key) and the observed feed identity is the head: an identical feed records nothing"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 3600
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
