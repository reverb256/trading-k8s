apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-gmgn-track
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-gmgn-track
      values: |
        name: trading-gmgn-track
        schedule: "* * * * *"
        command: ["python", "tools/gmgn_track.py"]
        deadline: 55
        repoMount: true
        configMount: true
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
