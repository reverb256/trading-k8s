apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-gmgn-track
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-gmgn-track
      values: |
        name: trading-gmgn-track
        schedule: "2-59/5 * * * *"
        command: ["python", "tools/gmgn_track.py"]
        backoffLimit: 0   # never re-run a whole sweep: a retry is more requests
        deadline: 55
        repoMount: true
        configMount: true
        hostNetwork: false
        nodeName: nexus
        env:
          - name: GOVERNED_POLL
            value: "1"
        trigger:
          kind: "external-poll"
          justification: "tracks smart-money around OUR positions: the book (fills) is the head; GMGN traffic itself is governed by gmgn_common"
          governor: "governed_poll"
          change-detection: true
          staleness-floor: 900
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
