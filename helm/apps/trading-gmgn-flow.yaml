apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-gmgn-flow
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-gmgn-flow
      values: |
        name: trading-gmgn-flow
        schedule: "1-59/5 * * * *"   # GMGN stagger: offset off the :00/:05 cluster burst
        command: ["python", "tools/gmgn_flow.py"]
        backoffLimit: 0   # never re-run a whole sweep: a retry is more requests
        deadline: 240
        repoMount: true
        configMount: true
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
