apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-backup
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-backup
      values: |
        name: trading-backup
        schedule: "15 4 * * *"
        command: ["bash", "scripts/backup_trading_data.sh"]
        deadline: 1800
        repoMount: true
        configMount: true
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
