apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trading-reconcile-evm
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: trading
  source:
    repoURL: https://github.com/reverb256/trading-k8s.git
    targetRevision: main
    path: helm/charts/py-job
    helm:
      releaseName: trading-reconcile-evm
      values: |
        name: trading-reconcile-evm
        schedule: "20 5 * * *"
        command: ["sh", "-c", "set -a; . /work/data/exec.env 2>/dev/null; set +a; exec python tools/reconcile_evm.py"]
        deadline: 600
        repoMount: true
        configMount: false
        hostNetwork: false
        nodeName: nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - CreateNamespace=true
