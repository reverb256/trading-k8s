{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: rhc-feed-relay
spec:
  selector:
    app.kubernetes.io/name: rhc-feed-relay
  ports:
    - name: feed
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
{{- end }}
