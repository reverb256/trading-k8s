apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: rhc-feed-relay
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the pod binds host port 9642, so a rolling
  # update would deadlock with two pods contending for the same port. There is
  # also nothing to stay up for during a rollout -- consumers reconnect.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rhc-feed-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rhc-feed-relay
    spec:
      nodeName: {{ .Values.nodeName }}
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      # Required with hostNetwork, otherwise the pod inherits the node's
      # resolv.conf and cannot resolve the upstream feed hostname.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: relay
          image: "{{ .Values.image }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["{{ .Values.entrypoint }}"]
          args:
            {{- range .Values.args }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: feed
              containerPort: {{ .Values.port }}
              protocol: TCP
          # Readiness proves the relay is RELAYING, not merely listening. The
          # old tcpSocket probe passed on a relay connected to nothing upstream:
          # 9642 accepts TCP (even completing the WS 101 upgrade) while the
          # sequencer handshake is refused upstream, so the relay read
          # Synced/Healthy and masked the outage. This exec probe connects as a
          # real WebSocket client and counts DATA frames.
          #
          # httpGet is not an option, same reason as before: the handler answers
          # a plain GET with "400 handshake error: bad Upgrade header".
          readinessProbe:
            exec:
              command:
                - python3
                - /opt/relay-probe/relay_data_probe.py
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          # Liveness stays WEAK on purpose. A dead upstream is not a dead
          # process, and restarting cannot fix an external 403 -- it would only
          # churn the pod an operator is inspecting. Real process death is still
          # caught by readiness (connection refused -> Unready).
          livenessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: relayprobe
              mountPath: /opt/relay-probe
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: relayprobe
          configMap:
            name: {{ .Release.Name }}-probe
