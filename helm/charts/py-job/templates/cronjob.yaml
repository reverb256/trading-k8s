apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.deadline }}
      template:
        spec:
          restartPolicy: Never
          {{- if .Values.hostNetwork }}
          hostNetwork: true
          {{- end }}
          {{- if .Values.gpu }}
          runtimeClassName: nvidia
          {{- end }}
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.nodeName }}
          containers:
            - name: job
              image: {{ .Values.image }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              command: {{ toJson .Values.command }}
              env:
                - name: RHFEED_SRC
                  value: "/opt/rhfeed/src"
              resources:
                requests:
                  cpu: {{ .Values.cpuRequest | default "100m" }}
                  memory: {{ .Values.memRequest | default "256Mi" }}
                limits:
                  cpu: {{ .Values.cpuLimit | default "2" }}
                  memory: {{ .Values.memLimit | default "4Gi" }}
                  {{- if .Values.gpu }}
                  nvidia.com/gpu: 1
                  {{- end }}
              volumeMounts:
                - name: data
                  mountPath: /work/data
                - name: stampede
                  mountPath: /stampede
                  readOnly: true
                - name: rhcfeed
                  mountPath: /opt/rhfeed/src
                  readOnly: true
          volumes:
            - name: data
              hostPath:
                path: {{ .Values.dataPath | default "/home/j_kro/Work/trading/data" }}
                type: Directory
            - name: stampede
              hostPath:
                path: /home/j_kro/stampede/data
                type: Directory
            - name: rhcfeed
              hostPath:
                path: {{ .Values.rhfeedPath | default "/home/j_kro/rhc-feed/src" }}
                type: Directory
