apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.trigger }}
  annotations:
    {{- range $k, $v := . }}
    trading.dev/trigger-{{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # NOTE: not `| default 2` - Sprig treats 0 as empty, so an explicit
      # backoffLimit: 0 (never re-run a sweep) would silently render 2.
      backoffLimit: {{ if hasKey .Values "backoffLimit" }}{{ .Values.backoffLimit }}{{ else }}2{{ end }}
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: {{ .Values.deadline }}
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          {{- if .Values.hostNetwork }}
          hostNetwork: true
          {{- end }}
          {{- if .Values.gpu }}
          runtimeClassName: nvidia
          {{- end }}
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.nodeName }}
          # nodeSelector alone targets a host but does not clear its taints: forge
          # carries node-role.kubernetes.io/control-plane=NoSchedule, so a job
          # pinned there Pends forever with `1 node(s) had untolerated taint(s)`
          # (seen 2026-09-25 on trading-feed-forge). Set .Values.tolerations for
          # any app whose nodeName is a control-plane host.
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: job
              image: {{ .Values.image }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              command: {{ toJson .Values.command }}
              env:
                - name: HOME
                  value: "/home/j_kro"
                - name: RHFEED_SRC
                  value: "/opt/rhfeed/src"
                # env (list of {name, value}) adds per-app container env after
                # the two above — same shape as the py-svc chart. Empty/absent
                # renders nothing.
                {{- range .Values.env }}
                - name: {{ .name }}
                  value: {{ .value | quote }}
                {{- end }}
              resources:
                # Policy (t_6cf16590) — do CronJob pods get requests-sized at all?
                # YES. A request is the scheduler's reservation for as long as the
                # pod holds it, and a cron pod holds one for its whole run, so the
                # "request below observed p95 is a scheduling blind spot" rule
                # applies to per-run pods exactly as it does to a long-running
                # service. The 10m/64Mi below is therefore a FLOOR for a workload
                # nobody has measured (the same thing the cluster-wide
                # `default-requests` LimitRange is), never a size: a floor is not
                # a size.
                # Sizing convention (same as the rest of the cluster): workload-level
                # p95 from VictoriaMetrics, 7d window at 5m resolution, MAX over
                # every pod incarnation of the workload, cpu rounded up to the next
                # 10m and memory to the next 16Mi, with request <= limit (this
                # chart's limits are cpu 2 / memory 4Gi, so cpu has room).
                # Size each CronJob from ITS OWN p95 — never from the namespace-wide
                # max over `job` containers. On 2026-09-22 the ns-wide max was
                # 366.2m and that is trading-lab's own workload p95: its 8
                # incarnations were the top 8 pods in the namespace, and the first
                # pod belonging to any other workload read 29.6m. Only 6 of the 41
                # CronJobs exceed 10m at all (the other 35 are at 0-10m or never
                # lived long enough to be scraped), so one number for all of them
                # would be wrong in both directions.
                # A pod made by `kubectl create job --from=cronjob/<x>` carries an
                # ownerRef to <x>, so KSM resolves it as an incarnation of that
                # CronJob and it belongs in that workload's max.
                # Per-workload values live in helm/apps/<name>.yaml (cpuRequest /
                # memRequest). Requests only: limits are a separate pass, because a
                # request below p95 is a blind spot while a limit near p95 is an
                # OOMKill waiting to happen.
                requests:
                  cpu: {{ .Values.cpuRequest | default "10m" }}
                  memory: {{ .Values.memRequest | default "64Mi" }}
                limits:
                  cpu: {{ .Values.cpuLimit | default "2" }}
                  memory: {{ .Values.memLimit | default "4Gi" }}
                  {{- if .Values.gpu }}
                  nvidia.com/gpu: 1
                  {{- end }}
              volumeMounts:
                {{- if .Values.repoMount }}
                - name: repo
                  mountPath: /work
                {{- else }}
                - name: data
                  mountPath: /work/data
                {{- end }}
                {{- if .Values.configMount }}
                - name: gmgncfg
                  mountPath: /home/j_kro/.config/gmgn
                  readOnly: true
                - name: jupcfg
                  mountPath: /home/j_kro/.config/jup
                  readOnly: true
                - name: tradingcfg
                  mountPath: /home/j_kro/.config/trading
                  readOnly: true
                {{- end }}
                - name: stampede
                  mountPath: /stampede
                  readOnly: true
                - name: rhcfeed
                  mountPath: /opt/rhfeed/src
                  readOnly: true
          volumes:
            {{- if .Values.repoMount }}
            - name: repo
              hostPath:
                path: /home/j_kro/Work/trading
                type: Directory
            {{- else }}
            - name: data
              hostPath:
                path: {{ .Values.dataPath | default "/home/j_kro/Work/trading/data" }}
                type: Directory
            {{- end }}
            {{- if .Values.configMount }}
            - name: gmgncfg
              hostPath:
                path: /home/j_kro/.config/gmgn
                type: Directory
            - name: jupcfg
              hostPath:
                path: /home/j_kro/.config/jup
                type: Directory
            - name: tradingcfg
              hostPath:
                path: /home/j_kro/.config/trading
                type: Directory
            {{- end }}
            - name: stampede
              hostPath:
                path: /home/j_kro/stampede/data
                type: Directory
            - name: rhcfeed
              hostPath:
                path: {{ .Values.rhfeedPath | default "/home/j_kro/rhc-feed/src" }}
                type: Directory
