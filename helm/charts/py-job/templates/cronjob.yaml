apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.deadline }}
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.nodeName }}
          containers:
            - name: job
              image: {{ .Values.image }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              command: {{ toJson .Values.command }}
              {{- if .Values.gpu }}
              resources:
                limits:
                  nvidia.com/gpu: 1
              {{- end }}
              volumeMounts:
                - name: data
                  mountPath: /work/data
                - name: stampede
                  mountPath: /stampede
                  readOnly: true
          volumes:
            - name: data
              hostPath:
                path: /home/j_kro/Work/trading/data
                type: Directory
            - name: stampede
              hostPath:
                path: /home/j_kro/stampede/data
                type: Directory
