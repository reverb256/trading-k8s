apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.deadline }}
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          {{- if .Values.hostNetwork }}
          hostNetwork: true
          {{- end }}
          {{- if .Values.gpu }}
          runtimeClassName: nvidia
          {{- end }}
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.nodeName }}
          containers:
            - name: job
              image: {{ .Values.image }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              command: {{ toJson .Values.command }}
              env:
                - name: HOME
                  value: "/home/j_kro"
                - name: RHFEED_SRC
                  value: "/opt/rhfeed/src"
              resources:
                requests:
                  cpu: {{ .Values.cpuRequest | default "10m" }}
                  memory: {{ .Values.memRequest | default "64Mi" }}
                limits:
                  cpu: {{ .Values.cpuLimit | default "2" }}
                  memory: {{ .Values.memLimit | default "4Gi" }}
                  {{- if .Values.gpu }}
                  nvidia.com/gpu: 1
                  {{- end }}
              volumeMounts:
                {{- if .Values.repoMount }}
                - name: repo
                  mountPath: /work
                {{- else }}
                - name: data
                  mountPath: /work/data
                {{- end }}
                {{- if .Values.configMount }}
                - name: gmgncfg
                  mountPath: /home/j_kro/.config/gmgn
                  readOnly: true
                - name: jupcfg
                  mountPath: /home/j_kro/.config/jup
                  readOnly: true
                - name: tradingcfg
                  mountPath: /home/j_kro/.config/trading
                  readOnly: true
                {{- end }}
                - name: stampede
                  mountPath: /stampede
                  readOnly: true
                - name: rhcfeed
                  mountPath: /opt/rhfeed/src
                  readOnly: true
          volumes:
            {{- if .Values.repoMount }}
            - name: repo
              hostPath:
                path: /home/j_kro/Work/trading
                type: Directory
            {{- else }}
            - name: data
              hostPath:
                path: {{ .Values.dataPath | default "/home/j_kro/Work/trading/data" }}
                type: Directory
            {{- end }}
            {{- if .Values.configMount }}
            - name: gmgncfg
              hostPath:
                path: /home/j_kro/.config/gmgn
                type: Directory
            - name: jupcfg
              hostPath:
                path: /home/j_kro/.config/jup
                type: Directory
            - name: tradingcfg
              hostPath:
                path: /home/j_kro/.config/trading
                type: Directory
            {{- end }}
            - name: stampede
              hostPath:
                path: /home/j_kro/stampede/data
                type: Directory
            - name: rhcfeed
              hostPath:
                path: {{ .Values.rhfeedPath | default "/home/j_kro/rhc-feed/src" }}
                type: Directory
