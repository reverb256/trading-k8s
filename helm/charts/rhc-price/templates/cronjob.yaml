apiVersion: batch/v1
kind: CronJob
metadata:
  name: trading-rhc-price
  namespace: {{ .Release.Namespace }}
  {{- with .Values.trigger }}
  annotations:
    {{- range $k, $v := . }}
    trading.dev/trigger-{{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 600
      # 240 -> 480 (2026-10-02). activeDeadlineSeconds counts from JOB creation,
      # so it is already 30-40s old (measured under the current node load) by the
      # time the container starts, while the sampler itself runs 3.5-4 min when
      # the box is busy. Deadline 240 was therefore inside the run time: a
      # successful run (pod exited 0, printed "RHC-PRICE-OK tokens=45 of 45")
      # was raced by the deadline and the Job controller stamped it Failed with
      # reason DeadlineExceeded, so stack-sentinel reported phantom
      # "k8s jobs failing" for trading-rhc-price-29849140/-45/-50. Same lesson as
      # rhc-grad-watch and feed-lane: a deadline must clear pod start plus the
      # tool bound, not sit inside it. 480s keeps a hung run bounded while giving
      # a normal run ~2x headroom. concurrencyPolicy: Forbid below is what stops
      # the next */5 tick from overlapping if a run ever does run long.
      activeDeadlineSeconds: 480
      template:
        spec:
          restartPolicy: Never
          # securityContext: this chart was the only trading workload without one,
          # so its pod ran as ROOT and wrote data/rpc_gov.json + data/rpc_cache.json
          # root-owned.  rpc_common._save names its temp file `<file>.<pid>.tmp` and
          # every container execs python as PID 1, so the root rhc-price pod and the
          # uid-1000 job pods collided on `rpc_gov.json.1.tmp` /
          # `rpc_cache.json.1.tmp`: whichever lost the race died with
          # PermissionError [Errno 13] and the k8s backoff retry then succeeded,
          # which is why it read as intermittent.  Startup (corrected 2026-09-26):
          # the deployed trading-jobs image, not a stale image, is what collides --
          # ebff158 only added the pid, it is not unique across pods.
          # Same posture as py-job/py-svc.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.nodeName }}
          containers:
            - name: rhc-price
              image: {{ .Values.image }}
              env:
                # env (list of {name, value}) - same shape as py-job/py-svc; empty renders
                # nothing. GOVERNED_POLL=1 is what makes the change-detection gate engage
                # in the scheduled copy (docs/EVENT-DRIVEN.md).
                {{- range .Values.env }}
                - name: {{ .name }}
                  value: {{ .value | quote }}
                {{- end }}
              imagePullPolicy: {{ .Values.imagePullPolicy }}
              resources:
                # Policy (t_6cf16590) - CronJob pods ARE requests-sized, and this
                # workload is the case that proves it: the sampler is CPU-bound
                # (its own cumulative counter goes 0.07 -> 26.12 cpu-seconds
                # inside a single ~30 s run = 0.87 cores sustained), so the
                # 10m/64Mi `default-requests` LimitRange floor it used to inherit
                # is a floor, not a size.  Before t_5edaea07 this container had NO
                # `resources:` block at all, which is why no values key could have
                # sized it.
                # Sizing convention (cluster-wide, see
                # media-k8s cluster/addons/default-requests/README.md): p95 from
                # VictoriaMetrics, 7d window at 5m resolution, MAX over every pod
                # incarnation of the workload, cpu rounded up to the next 10m and
                # memory to the next 16Mi, with request <= limit.
                # Own p95 over 438 incarnations: cpu 868.27m, memory 163.51Mi ->
                # 870m / 176Mi, set per workload in
                # helm/apps/trading-rhc-price.yaml (cpuRequest / memRequest).
                # Requests only: this chart declares no limits at all, so
                # `request <= limit` is not binding here and the limit question
                # belongs to the separate limit pass (t_56f17002).  The 10m/64Mi
                # defaults below render exactly the floor the LimitRange was
                # already applying, so an app that sets nothing is unchanged.
                requests:
                  cpu: {{ .Values.cpuRequest | default "10m" }}
                  memory: {{ .Values.memRequest | default "64Mi" }}
              volumeMounts:
                - name: data
                  mountPath: /work/data
                - name: stampede
                  mountPath: /stampede
                  readOnly: true
          volumes:
            - name: data
              hostPath:
                path: {{ .Values.dataHostPath }}
                type: Directory
            - name: stampede
              hostPath:
                path: {{ .Values.stampedeHostPath }}
                type: Directory
