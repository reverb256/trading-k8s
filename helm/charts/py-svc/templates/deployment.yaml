apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      restartPolicy: Always
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      {{- end }}
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      {{- if .Values.initCommand }}
      initContainers:
        - name: init-deps
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: {{ toJson .Values.initCommand }}
          volumeMounts:
            - name: repo
              mountPath: /work
      {{- end }}
      containers:
        - name: svc
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if .Values.workdir }}
          workingDir: {{ .Values.workdir }}
          {{- end }}
          command: {{ toJson .Values.command }}
          env:
            - name: HOME
              value: "/home/j_kro"
            - name: RHFEED_SRC
              value: "/opt/rhfeed/src"
          resources:
            requests:
              cpu: {{ .Values.cpuRequest | default "100m" }}
              memory: {{ .Values.memRequest | default "256Mi" }}
            limits:
              cpu: {{ .Values.cpuLimit | default "2" }}
              memory: {{ .Values.memLimit | default "4Gi" }}
          volumeMounts:
            - name: repo
              mountPath: /work
            - name: stampede
              mountPath: /stampede
              readOnly: true
            - name: stampede-home
              mountPath: /home/j_kro/stampede/data
              readOnly: true
            - name: rhcfeed
              mountPath: /opt/rhfeed/src
              readOnly: true
            - name: gmgncfg
              mountPath: /home/j_kro/.config/gmgn
              readOnly: true
            - name: jupcfg
              mountPath: /home/j_kro/.config/jup
              readOnly: true
            - name: tradingcfg
              mountPath: /home/j_kro/.config/trading
              readOnly: true
      volumes:
        - name: repo
          hostPath:
            path: /home/j_kro/Work/trading
            type: Directory
        - name: stampede
          hostPath:
            path: /home/j_kro/stampede/data
            type: Directory
        - name: stampede-home
          hostPath:
            path: /home/j_kro/stampede/data
            type: Directory
        - name: rhcfeed
          hostPath:
            path: /home/j_kro/rhc-feed/src
            type: Directory
        - name: gmgncfg
          hostPath:
            path: /home/j_kro/.config/gmgn
            type: Directory
        - name: jupcfg
          hostPath:
            path: /home/j_kro/.config/jup
            type: Directory
        - name: tradingcfg
          hostPath:
            path: /home/j_kro/.config/trading
            type: Directory
