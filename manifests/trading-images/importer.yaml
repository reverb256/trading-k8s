# Declarative image import (2026-09-22): imports the kaniko tar into the k3s
# containerd via its socket -- no host docker, no host ctr.
#
# REQUESTS (t_5edaea07): the `importer` container declares NO resources, and it
# deliberately stays that way -- there is nothing to size it from.  This CronJob
# is `suspend: true` with the placeholder schedule `0 0 31 2 *` (a date that
# never occurs), and KSM's own record over the full 7d window has 0 Jobs, 0 pods,
# no `lastScheduleTime` and no `nextScheduleTime` for it, so it has never had a
# measurable incarnation.  Committing a number here would be inventing one.  The
# disposition is recorded in `reverb256/media-k8s`
# `cluster/addons/default-requests/README.md` section 2 (known gaps); re-open
# when the importer is first run for real, and size it from ITS OWN p95 then --
# `ctr images import` of a ~GB tar is I/O-bound, not CPU-bound, so this
# workload's profile will not look like `rhc-price`'s (870m/176Mi, the other
# trading container t_5edaea07 sized).
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    trading.dev/trigger-kind: "calendar"
    trading.dev/trigger-justification: "suspended, operator-run image build/import: host-side ops, not trading work; suspend: true keeps the placeholder calendar off"
    trading.dev/trigger-mutates: "ops"
  name: trading-image-import
  namespace: trading
spec:
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: nexus
          containers:
            - name: importer
              image: rancher/k3s:v1.31.5-k3s1
              command: ["/bin/sh", "-c"]
              args:
                - "ctr --address /run/k3s/containerd/containerd.sock -n k8s.io images import /work/data/images/trading-jobs.tar && ctr --address /run/k3s/containerd/containerd.sock -n k8s.io images tag --force docker.io/library/trading-jobs:latest docker.io/library/trading-jobs:local && echo IMPORT-OK"
              volumeMounts:
                - {name: data, mountPath: /work/data}
                - {name: containerd, mountPath: /run/k3s/containerd}
              securityContext:
                runAsUser: 0
          volumes:
            - name: data
              hostPath: {path: /home/j_kro/Work/trading/data, type: Directory}
            - name: containerd
              hostPath: {path: /run/k3s/containerd, type: Directory}
